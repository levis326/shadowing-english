name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match the tag to pubspec.yaml
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -nE 's/^version: ([^+]+).*/\1/p' pubspec.yaml)"
          test -n "$package_version"
          test "$tag_version" = "$package_version"

  android:
    name: Build Android APK
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --flavor prod -t lib/main_prod.dart
      - name: Package APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          cp build/app/outputs/flutter-apk/app-prod-release.apk "release-assets/shadowing-english-${TAG}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-assets/*

  linux:
    name: Build Linux bundle
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libmpv-dev nasm ninja-build
      - name: Cache subtitle FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-bundle/linux-x64
          key: ffmpeg-8.1.2-linux-x64-${{ hashFiles('tool/ffmpeg/build_ffmpeg.sh') }}
      - name: Build subtitle FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash tool/ffmpeg/build_ffmpeg.sh linux-x64 build/ffmpeg-bundle/linux-x64
      - name: Smoke test subtitle FFmpeg
        run: |
          ffmpeg_bin="build/ffmpeg-bundle/linux-x64/ffmpeg"
          smoke_dir="$(mktemp -d)"
          "$ffmpeg_bin" -y -f lavfi -i sine=frequency=1000:duration=2 -c:a pcm_s16le "$smoke_dir/input.wav"
          "$ffmpeg_bin" -y -i "$smoke_dir/input.wav" -vn -ac 1 -ar 16000 -b:a 24k -f segment -segment_time 1 -reset_timestamps 1 "$smoke_dir/chunk_%05d.m4a"
          test -s "$smoke_dir/chunk_00000.m4a"
          "$ffmpeg_bin" -y -i "$smoke_dir/input.wav" -i tool/ffmpeg/smoke.srt -c:a aac -c:s mov_text -f ipod "$smoke_dir/embedded.mp4"
          "$ffmpeg_bin" -v error -i "$smoke_dir/embedded.mp4" -map 0:s:0 -f srt - | grep -q "Hello from the subtitle smoke test"
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Bundle subtitle FFmpeg
        run: |
          mkdir -p build/linux/x64/release/bundle/lib/ffmpeg
          cp -a build/ffmpeg-bundle/linux-x64/. build/linux/x64/release/bundle/lib/ffmpeg/
          test -x build/linux/x64/release/bundle/lib/ffmpeg/ffmpeg
      - name: Cache subtitle Whisper server
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: build/whisper-bundle/linux-x64
          key: whisper-1.9.2-linux-x64-${{ hashFiles('tool/whisper/build_whisper.sh') }}
      - name: Build subtitle Whisper server
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: bash tool/whisper/build_whisper.sh linux-x64 build/whisper-bundle/linux-x64
      - name: Smoke test subtitle Whisper server
        run: |
          test -x build/whisper-bundle/linux-x64/whisper-server
          build/whisper-bundle/linux-x64/whisper-server --help 2>&1 | grep -qi whisper
      - name: Cache subtitle Whisper model
        id: whisper-model-cache
        uses: actions/cache@v4
        with:
          path: build/whisper-model
          key: whisper-model-ggml-small-${{ hashFiles('tool/whisper/fetch_model.sh') }}
      - name: Fetch subtitle Whisper model
        if: steps.whisper-model-cache.outputs.cache-hit != 'true'
        run: bash tool/whisper/fetch_model.sh build/whisper-model
      - name: Bundle subtitle Whisper
        run: |
          mkdir -p build/linux/x64/release/bundle/lib/whisper
          cp -a build/whisper-bundle/linux-x64/. build/linux/x64/release/bundle/lib/whisper/
          cp build/whisper-model/ggml-small.bin build/linux/x64/release/bundle/lib/whisper/
          test -x build/linux/x64/release/bundle/lib/whisper/whisper-server
          test -s build/linux/x64/release/bundle/lib/whisper/ggml-small.bin
      - name: Package Linux bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          tar -C build/linux/x64/release -czf "release-assets/shadowing-english-${TAG}-linux-x64.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release-assets/*

  macos:
    name: Build macOS app
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - name: Cache subtitle FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-bundle/macos-universal
          key: ffmpeg-8.1.2-macos-universal-${{ hashFiles('tool/ffmpeg/build_ffmpeg.sh') }}
      - name: Build subtitle FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash tool/ffmpeg/build_ffmpeg.sh macos-universal build/ffmpeg-bundle/macos-universal
      - name: Smoke test subtitle FFmpeg
        run: |
          ffmpeg_bin="build/ffmpeg-bundle/macos-universal/ffmpeg"
          smoke_dir="$(mktemp -d)"
          "$ffmpeg_bin" -y -f lavfi -i sine=frequency=1000:duration=2 -c:a pcm_s16le "$smoke_dir/input.wav"
          "$ffmpeg_bin" -y -i "$smoke_dir/input.wav" -vn -ac 1 -ar 16000 -b:a 24k -f segment -segment_time 1 -reset_timestamps 1 "$smoke_dir/chunk_%05d.m4a"
          test -s "$smoke_dir/chunk_00000.m4a"
          "$ffmpeg_bin" -y -i "$smoke_dir/input.wav" -i tool/ffmpeg/smoke.srt -c:a aac -c:s mov_text -f ipod "$smoke_dir/embedded.mp4"
          "$ffmpeg_bin" -v error -i "$smoke_dir/embedded.mp4" -map 0:s:0 -f srt - | grep -q "Hello from the subtitle smoke test"
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Cache subtitle Whisper server
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: build/whisper-bundle/macos-universal
          key: whisper-1.9.2-macos-universal-${{ hashFiles('tool/whisper/build_whisper.sh') }}
      - name: Build subtitle Whisper server
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: bash tool/whisper/build_whisper.sh macos-universal build/whisper-bundle/macos-universal
      - name: Smoke test subtitle Whisper server
        run: |
          test -x build/whisper-bundle/macos-universal/whisper-server
          build/whisper-bundle/macos-universal/whisper-server --help 2>&1 | grep -qi whisper
      - name: Cache subtitle Whisper model
        id: whisper-model-cache
        uses: actions/cache@v4
        with:
          path: build/whisper-model
          key: whisper-model-ggml-small-${{ hashFiles('tool/whisper/fetch_model.sh') }}
      - name: Fetch subtitle Whisper model
        if: steps.whisper-model-cache.outputs.cache-hit != 'true'
        run: bash tool/whisper/fetch_model.sh build/whisper-model
      - name: Package macOS app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets dmg-root
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir -p "$app_path/Contents/Resources/ffmpeg"
          cp -a build/ffmpeg-bundle/macos-universal/. "$app_path/Contents/Resources/ffmpeg/"
          test -x "$app_path/Contents/Resources/ffmpeg/ffmpeg"
          mkdir -p "$app_path/Contents/Resources/whisper"
          cp -a build/whisper-bundle/macos-universal/. "$app_path/Contents/Resources/whisper/"
          cp build/whisper-model/ggml-small.bin "$app_path/Contents/Resources/whisper/"
          test -x "$app_path/Contents/Resources/whisper/whisper-server"
          test -s "$app_path/Contents/Resources/whisper/ggml-small.bin"
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict "$app_path"
          cp -R "$app_path" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Shadowing English" -srcfolder dmg-root -ov -format UDZO \
            "${GITHUB_WORKSPACE}/release-assets/shadowing-english-${TAG}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release-assets/*

  windows:
    name: Build Windows bundle
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - name: Cache subtitle FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-bundle/windows-x64
          key: ffmpeg-8.1.2-windows-x64-${{ hashFiles('tool/ffmpeg/build_ffmpeg.sh') }}
      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          install: make diffutils nasm mingw-w64-x86_64-gcc
          msystem: MINGW64
      - name: Build subtitle FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash tool/ffmpeg/build_ffmpeg.sh windows-x64 build/ffmpeg-bundle/windows-x64
      - name: Smoke test subtitle FFmpeg
        shell: pwsh
        run: |
          # Use a minimal PATH so a non-self-contained ffmpeg.exe (e.g. one that
          # still links against MinGW runtime DLLs) fails here instead of only
          # breaking on end-user machines that lack those DLLs.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $ffmpeg = "build/ffmpeg-bundle/windows-x64/ffmpeg.exe"
          $smoke = "build/ffmpeg-smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          & $ffmpeg -y -f lavfi -i "sine=frequency=1000:duration=2" -c:a pcm_s16le "$smoke/input.wav"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ffmpeg -y -i "$smoke/input.wav" -vn -ac 1 -ar 16000 -b:a 24k -f segment -segment_time 1 -reset_timestamps 1 "$smoke/chunk_%05d.m4a"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$smoke/chunk_00000.m4a")) { exit 1 }
          & $ffmpeg -y -i "$smoke/input.wav" -i tool/ffmpeg/smoke.srt -c:a aac -c:s mov_text -f ipod "$smoke/embedded.mp4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $subtitle = & $ffmpeg -v error -i "$smoke/embedded.mp4" -map 0:s:0 -f srt -
          if ($LASTEXITCODE -ne 0 -or ($subtitle -join "`n") -notmatch "Hello from the subtitle smoke test") { exit 1 }
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Cache subtitle Whisper server
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: build/whisper-bundle/windows-x64
          key: whisper-1.9.2-windows-x64-${{ hashFiles('tool/whisper/build_whisper.sh') }}
      - name: Build subtitle Whisper server
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash tool/whisper/build_whisper.sh windows-x64 build/whisper-bundle/windows-x64
      - name: Smoke test subtitle Whisper server
        shell: pwsh
        run: |
          $whisper = "build/whisper-bundle/windows-x64/whisper-server.exe"
          if (-not (Test-Path $whisper)) { exit 1 }
          & $whisper --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache subtitle Whisper model
        id: whisper-model-cache
        uses: actions/cache@v4
        with:
          path: build/whisper-model
          key: whisper-model-ggml-small-${{ hashFiles('tool/whisper/fetch_model.sh') }}
      - name: Fetch subtitle Whisper model
        if: steps.whisper-model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash tool/whisper/fetch_model.sh build/whisper-model
      - name: Cache local NLLB translator
        id: nllb-cache
        uses: actions/cache@v4
        with:
          path: build/nllb-bundle/windows-x64
          key: nllb-4.8.1-windows-x64-${{ hashFiles('tool/nllb/build_nllb.sh','tool/nllb/nllb_translate.cpp') }}
      - name: Build local NLLB translator
        if: steps.nllb-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash tool/nllb/build_nllb.sh windows-x64 build/nllb-bundle/windows-x64
      - name: Smoke test local NLLB translator
        shell: pwsh
        run: |
          $nllb = "build/nllb-bundle/windows-x64/nllb-translate.exe"
          if (-not (Test-Path $nllb)) { Write-Host "MISSING: $nllb"; exit 1 }
          & $nllb --help
          $code = $LASTEXITCODE
          Write-Host "nllb-translate --help exit code: $code"
          if ($code -ne 0) { exit $code }
      - name: Cache local NLLB model
        id: nllb-model-cache
        uses: actions/cache@v4
        with:
          path: build/nllb-model
          key: nllb-model-600M-int8-${{ hashFiles('tool/nllb/fetch_model.sh') }}
      - name: Fetch local NLLB model
        if: steps.nllb-model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash tool/nllb/fetch_model.sh build/nllb-model
      - name: Bundle subtitle FFmpeg
        shell: pwsh
        run: |
          Copy-Item build/ffmpeg-bundle/windows-x64 build/windows/x64/runner/Release/ffmpeg -Recurse
          if (-not (Test-Path build/windows/x64/runner/Release/ffmpeg/ffmpeg.exe)) { exit 1 }
      - name: Bundle subtitle Whisper
        shell: pwsh
        run: |
          Copy-Item build/whisper-bundle/windows-x64 build/windows/x64/runner/Release/whisper -Recurse
          Copy-Item build/whisper-model/ggml-small.bin build/windows/x64/runner/Release/whisper/
          if (-not (Test-Path build/windows/x64/runner/Release/whisper/whisper-server.exe)) { exit 1 }
          if (-not (Test-Path build/windows/x64/runner/Release/whisper/ggml-small.bin)) { exit 1 }
      - name: Bundle local NLLB translator and model
        shell: pwsh
        run: |
          Copy-Item build/nllb-bundle/windows-x64 build/windows/x64/runner/Release/nllb -Recurse
          Copy-Item build/nllb-model/model.bin build/windows/x64/runner/Release/nllb/
          Copy-Item build/nllb-model/shared_vocabulary.json build/windows/x64/runner/Release/nllb/
          Copy-Item build/nllb-model/sentencepiece.bpe.model build/windows/x64/runner/Release/nllb/
          Copy-Item build/nllb-model/config.json build/windows/x64/runner/Release/nllb/
          Copy-Item build/nllb-model/MODEL-INFO.txt build/windows/x64/runner/Release/nllb/
          if (-not (Test-Path build/windows/x64/runner/Release/nllb/nllb-translate.exe)) { exit 1 }
          if (-not (Test-Path build/windows/x64/runner/Release/nllb/model.bin)) { exit 1 }
          if (-not (Test-Path build/windows/x64/runner/Release/nllb/sentencepiece.bpe.model)) { exit 1 }
      - name: Package Windows bundle
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force release-assets
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "release-assets/shadowing-english-$env:TAG-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release-assets/*

  publish:
    name: Publish GitHub Release
    needs: [android, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Create release with generated update notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
